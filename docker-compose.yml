version: '3.8'

services:
  # Zookeeper - Kafka's helper/manager
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: biosphere-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - biosphere-network

  # Kafka - The main message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: biosphere-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168  # Keep messages for 7 days
      KAFKA_MESSAGE_MAX_BYTES: 10485760  # 10MB max message size
    networks:
      - biosphere-network

networks:
  biosphere-network:
    driver: bridge
